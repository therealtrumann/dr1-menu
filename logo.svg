<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Dancing+Script:wght@700&amp;family=Montserrat:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background cream -->
  <rect width="820" height="280" fill="#F8F3EE" rx="0"/>

  <!-- ── EMBLEM CIRCLE ── -->
  <!-- Outer circle -->
  <circle cx="148" cy="140" r="106" fill="none" stroke="#7A9B6A" stroke-width="2.2"/>

  <!-- ── OLIVE BRANCH (left of circle) ── -->
  <!-- Main branch stem -->
  <path d="M 55 100 Q 75 130 68 175" fill="none" stroke="#7A9B6A" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Leaves -->
  <ellipse cx="50" cy="108" rx="12" ry="20" fill="#8EAD7B" transform="rotate(-35 50 108)"/>
  <ellipse cx="40" cy="128" rx="10" ry="17" fill="#A5C090" transform="rotate(-20 40 128)"/>
  <ellipse cx="48" cy="148" rx="11" ry="18" fill="#8EAD7B" transform="rotate(10 48 148)"/>
  <ellipse cx="58" cy="165" rx="9" ry="15" fill="#A5C090" transform="rotate(30 58 165)"/>
  <!-- Small decorative dots -->
  <circle cx="88" cy="95" r="3.5" fill="#E8927C" opacity=".8"/>
  <circle cx="100" cy="82" r="2.5" fill="#E8927C" opacity=".5"/>
  <circle cx="78" cy="178" r="3" fill="#7A9B6A" opacity=".6"/>

  <!-- ── CHEF HAT ── -->
  <!-- Hat body (puff top) -->
  <path d="M 120 155
           Q 108 132 112 115
           Q 116 98  130 96
           Q 140 88  148 92
           Q 156 88  166 96
           Q 180 98  184 115
           Q 188 132 176 155 Z"
        fill="none" stroke="#7A9B6A" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hat brim -->
  <rect x="116" y="152" width="64" height="11" rx="5.5" fill="none" stroke="#7A9B6A" stroke-width="2.2"/>

  <!-- Heart inside hat -->
  <path d="M 148 136
           C 148 136 134 125 134 117
           C 134 110 141 107 148 114
           C 155 107 162 110 162 117
           C 162 125 148 136 148 136 Z"
        fill="#E8927C"/>

  <!-- ── TEXT BLOCK ── -->
  <!-- "Menú" -->
  <text x="295" y="118" font-family="'Playfair Display', Georgia, serif" font-weight="700"
        font-size="82" fill="#284D27" letter-spacing="-1">Men&#250;</text>

  <!-- "Sin" in script/italic salmon — centered relative to full text -->
  <text x="530" y="122" font-family="'Dancing Script', 'Brush Script MT', cursive" font-weight="700"
        font-size="84" fill="#E8927C" letter-spacing="0">Sin</text>

  <!-- Small sparkle marks near "Sin" -->
  <line x1="526" y1="58" x2="526" y2="72" stroke="#7A9B6A" stroke-width="2" stroke-linecap="round"/>
  <line x1="519" y1="65" x2="533" y2="65" stroke="#7A9B6A" stroke-width="2" stroke-linecap="round"/>
  <line x1="660" y1="55" x2="660" y2="67" stroke="#7A9B6A" stroke-width="2" stroke-linecap="round"/>
  <line x1="654" y1="61" x2="666" y2="61" stroke="#7A9B6A" stroke-width="2" stroke-linecap="round"/>

  <!-- "Estrés" -->
  <text x="295" y="205" font-family="'Playfair Display', Georgia, serif" font-weight="700"
        font-size="82" fill="#284D27" letter-spacing="-1">Estr&#233;s</text>

  <!-- ── DIVIDER LINE + HEART ── -->
  <line x1="296" y1="225" x2="470" y2="225" stroke="#7A9B6A" stroke-width="1.5"/>
  <!-- Heart center -->
  <path d="M 493 221 C 493 221 486 215 486 210 C 486 206 490 204 493 208 C 496 204 500 206 500 210 C 500 215 493 221 493 221 Z"
        fill="#E8927C"/>
  <line x1="516" y1="225" x2="690" y2="225" stroke="#7A9B6A" stroke-width="1.5"/>

  <!-- ── TAGLINE ── -->
  <text x="493" y="252" font-family="'Montserrat', 'Trebuchet MS', sans-serif" font-weight="500"
        font-size="16" fill="#7A9B6A" letter-spacing="3.5" text-anchor="middle">PLANIFICA &#x2022; COCINA &#x2022; DISFRUTA</text>
</svg>
